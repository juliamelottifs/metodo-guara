<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Cliente - Método Guará</title>

<link rel="stylesheet" href="style.css">

<style>

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#16181D;
}

.login-card{
    width:400px;
    padding:40px;
    background:#2A2A2A;
    border-radius:20px;
    text-align:center;
    border:1px solid #845033;
}

.login-card h2{
    color:#F3EFE8;
    margin-bottom:30px;
}

.login-card input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    border:none;
}

.erro{
    color:red;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>🔐 Área do Cliente</h2>

        <input
            type="email"
            id="email"
            placeholder="E-mail">

        <input
            type="password"
            id="senha"
            placeholder="Senha">

        <button
            class="btn-guara"
            onclick="fazerLogin()">

            Entrar

        </button>

        <div id="erro" class="erro"></div>

    </div>

</div>

<script>

function fazerLogin(){

    const email =
    document.getElementById("email").value;

    const senha =
    document.getElementById("senha").value;

    if(
        email === "percorre@metodoguara.online"
        &&
        senha === "123456"
    ){

        window.location.href =
        "dashboard-percorre.html";

    }else{

        document.getElementById("erro")
        .innerHTML =
        "E-mail ou senha inválidos.";

    }

}

</script>

</body>
</html>
